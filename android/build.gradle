// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.4'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  // play-services-ads 25.4.0 ships Kotlin 2.3.0 metadata, which this project's Kotlin 2.1.0
  // compiler rejects outright. The generated bytecode is compatible — only the metadata
  // version stamp is ahead — so the check is skipped rather than pinning an older ads SDK,
  // which was tried first and fails because the library's own sources call 25.x APIs.
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
      freeCompilerArgs.add('-Xskip-metadata-version-check')
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
